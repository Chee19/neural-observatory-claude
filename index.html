<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <meta name="application-name" content="Claude Usage Inspector" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Usage Inspector</title>
    <style>
      html, body { margin: 0; padding: 0; background: #111827; }
      #pre-loader {
        position: fixed; inset: 0; z-index: 9999;
        background: #111827;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 16px;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #pre-loader.hidden { opacity: 0; visibility: hidden; }
      .pl-ring {
        width: 44px; height: 44px;
        border: 3px solid rgba(52,211,153,0.15);
        border-top-color: #34d399;
        border-radius: 50%;
        animation: pl-spin 0.8s linear infinite;
      }
      .pl-label {
        font-family: ui-monospace, monospace;
        font-size: 12px; letter-spacing: 0.1em;
        color: #6ee7b7; text-transform: uppercase;
      }
      @keyframes pl-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="pre-loader">
      <div class="pl-ring"></div>
      <span class="pl-label">Loading</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
